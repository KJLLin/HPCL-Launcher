name: Sync Release to Gitee

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 只同步指定 tag，留空则同步全部 Release
        required: false
        type: string
      wipe_attachments:
        description: 是否删除 Gitee 该版本的全部附件（true / false）
        required: false
        default: "false"
        type: string
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: sync-release-to-gitee
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'KJLLin/HPCL-Launcher' }}
    name: Sync release pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync release pages to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITEE_OWNER: kjllin
          GITEE_REPO: hpcl-launcher
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          WIPE_ATTACHMENTS: ${{ github.event.inputs.wipe_attachments || 'false' }}
          PYTHONUNBUFFERED: "1"
          # GitHub runner 到 Gitee 的上行链路会在写数据阶段超时（实测 ConnectionAborted /
          # write timed out），10 MB 以上附件几乎必失败，因此附件改由本机/手动同步，
          # 这里只负责发行版页面与说明，避免每次发版都跑出一个红色 run。
          SYNC_ASSETS: "false"
          DOWNLOAD_NOTE: "> Windows 安装包可直接在本页附件下载；其他平台（deb / jar / sh）请前往 [GitHub Releases](https://github.com/KJLLin/HPCL-Launcher/releases)。"
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::warning::未配置 GITEE_TOKEN，跳过发行版同步"
            exit 0
          fi
          python3 -m pip install --quiet --disable-pip-version-check requests
          python3 -u scripts/sync_gitee_release.py
