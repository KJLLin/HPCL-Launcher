name: Sync Release to Gitee

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 只同步指定 tag，留空则同步全部 Release
        required: false
        type: string
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: sync-release-to-gitee
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'KJLLin/HPCL-Launcher' }}
    name: Sync releases and assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITEE_OWNER: kjllin
          GITEE_REPO: hpcl-launcher
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          MAX_ASSET_MB: "100"
          MAX_TOTAL_MB: "900"
          KEEP_STABLE: "2"
          KEEP_PRERELEASE: "2"
          PYTHONUNBUFFERED: "1"
          ARCHIVE_NOTE: "> 本版本的安装包已在 Gitee 归档，完整历史版本请前往 [GitHub 主仓库 Releases](https://github.com/KJLLin/HPCL-Launcher/releases) 下载。"
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::warning::未配置 GITEE_TOKEN，跳过发行版同步"
            exit 0
          fi
          python3 -m pip install --quiet --disable-pip-version-check requests
          python3 -u scripts/sync_gitee_release.py
